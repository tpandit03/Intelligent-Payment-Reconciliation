[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-payment-reconciliation"
version = "0.1.0"
description = "Deterministic payment reconciliation reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "pydantic>=2.6,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[project.scripts]
reconcile-payments = "reconciliation.cli:main"

[tool.setuptools.packages.find]
include = ["reconciliation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
